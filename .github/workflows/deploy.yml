name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run test:tools
      # Generates .generated/: sanitised articles, navigation, search index, media.
      - run: npm run build
      - name: SPA fallback and Pages flags
        run: |
          cp dist/canonn-science/browser/index.html dist/canonn-science/browser/404.html
          touch dist/canonn-science/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/canonn-science/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
