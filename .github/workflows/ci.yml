name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  content-guard:
    name: Content guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all content
        run: npm run content:check
      - name: Scan what this PR changes
        if: github.event_name == 'pull_request'
        env:
          GUARD_REPORT: ${{ runner.temp }}/guard-report.md
        run: node tools/content-guard.mjs --base origin/${{ github.base_ref }}
      - name: Publish the report to the job summary
        if: always() && github.event_name == 'pull_request'
        run: cat "${{ runner.temp }}/guard-report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: guard-report
          path: ${{ runner.temp }}/guard-report.md

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: content-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:tools
      - run: npm run build
